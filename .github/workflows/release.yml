# Builds a Windows standalone release and publishes it whenever a version
# tag (e.g. v0.1.0) is pushed. Split into two jobs:
#   build   — compiles the app, uploads the result as a workflow artifact
#   release — downloads that artifact, publishes it to a GitHub Release
# Keeping them separate means a build failure never creates a broken/partial
# release, and the build job alone could later be reused for CI on every push.
name: Release

on:
  push:
    tags:
      # Only runs on tags shaped like v0.1.0, v1.2.3-beta, etc. — not on
      # every commit to main. Trigger with:
      #   git tag v0.1.0 && git push origin v0.1.0
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Clone the repo onto the VM.
      # submodules: recursive is required — without it, src/lib/PLGL
      # checks out as an EMPTY folder, and `dotnet build` fails immediately.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt nuitka

      # Runs the exact same build script used locally: dotnet build for
      # the bridge DLL, then Nuitka for the standalone exe.
      - name: Build
        run: python scripts/build/pyside.py

      # Zip whatever *.dist folder Nuitka actually produced — its exact
      # name can shift depending on Nuitka version/entry-point naming,
      # so find it dynamically instead of hardcoding a guess.
      - name: Zip standalone build
        run: |
          $dist = Get-ChildItem build -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $dist) { throw "No *.dist folder found under build/" }
          Compress-Archive -Path "$($dist.FullName)\*" -DestinationPath pychonlang-windows.zip

      # Hand the zip off to the release job. Artifacts are how data moves
      # between jobs — each job runs on its own fresh VM with nothing shared.
      - uses: actions/upload-artifact@v4
        with:
          name: pychonlang-windows
          path: pychonlang-windows.zip

  release:
    needs: build
    runs-on: ubuntu-latest # no compiling here, so a cheaper/faster runner is fine
    permissions:
      contents: write   # required for softprops/action-gh-release to create a release

    steps:
      # Pulls down the zip that `build` uploaded above.
      - uses: actions/download-artifact@v4
        with:
          name: pychonlang-windows

      # Creates (or attaches to) a GitHub Release matching the pushed tag
      # and uploads the zip as a downloadable asset. Renamed here to
      # include the tag, since the artifact itself was uploaded generically.
      - name: Rename with version
        run: mv pychonlang-windows.zip pychonlang-${{ github.ref_name }}-windows.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: pychonlang-${{ github.ref_name }}-windows.zip